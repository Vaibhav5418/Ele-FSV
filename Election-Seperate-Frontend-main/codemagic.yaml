workflows:
  ios-capacitor-build:
    name: iOS Capacitor Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      xcode: latest
      node: 18
      cocoapods: default
      groups:
        - ios_credentials  # You'll set this up in Codemagic dashboard
      vars:
        BUNDLE_ID: "com.vesp.app"
        APP_NAME: "ESP-Vmukti"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"

    scripts:
      # Step 1: Install Node dependencies
      - name: Install npm dependencies
        script: |
          npm install

      # Step 2: Build the React web app
      - name: Build web app
        script: |
          npm run build

      # Step 3: Sync Capacitor (copies build/ to ios/)
      - name: Capacitor sync iOS
        script: |
          npx cap sync ios

      # Step 4: Install CocoaPods dependencies
      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install

      # Step 5: Set up code signing (for distribution)
      # Uncomment below after setting up certificates in Codemagic dashboard
      # - name: Set up code signing
      #   script: |
      #     keychain initialize
      #     app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_DEVELOPMENT
      #     keychain add-certificates
      #     xcode-project use-profiles

      # Step 6: Build the iOS app
      - name: Build iOS app
        script: |
          cd ios/App
          xcodebuild build \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -allowProvisioningUpdates \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      # Step 7: Archive for IPA (uncomment after code signing is set up)
      # - name: Archive iOS app
      #   script: |
      #     cd ios/App
      #     xcodebuild archive \
      #       -workspace App.xcworkspace \
      #       -scheme App \
      #       -configuration Release \
      #       -archivePath build/App.xcarchive \
      #       -destination 'generic/platform=iOS'

      # Step 8: Export IPA (uncomment after code signing is set up)
      # - name: Export IPA
      #   script: |
      #     cd ios/App
      #     xcodebuild -exportArchive \
      #       -archivePath build/App.xcarchive \
      #       -exportOptionsPlist exportOptions.plist \
      #       -exportPath build/output

    artifacts:
      # Collect the built IPA
      - ios/App/build/output/**/*.ipa
      - ios/App/build/**/*.xcarchive

    publishing:
      email:
        recipients:
          - your-email@example.com  # Change to your email
        notify:
          success: true
          failure: true
